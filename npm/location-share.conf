# NPM -> Proxy Host (tools.deinedomain.de) -> Tab "Custom locations" -> "Add location"
#   Define location: /s/     Scheme: http     Forward Hostname: tools-web     Port: 8080
# Dann auf das Zahnrad (⚙) klicken und DIESEN Text einfügen.
# Wichtig: KEIN auth_request hier - dieser Pfad ist absichtlich ohne Login erreichbar
# (die Plattform prüft selbst, ob der Freigabe-Link gültig und nicht abgelaufen ist).
# ERSETZEN: DEIN_TOOLS_SECRET durch den Wert von TOOLS_SECRET aus deiner .env

# Gemeinsames Geheimnis (wie bei der Location "/")
proxy_set_header X-Tools-Secret "DEIN_TOOLS_SECRET";

# Vom Client mitgeschickte Login-Header niemals durchlassen (leerer Wert = Header wird entfernt)
proxy_set_header X-authentik-username "";
proxy_set_header X-authentik-groups   "";
proxy_set_header X-authentik-email    "";
proxy_set_header X-authentik-name     "";
proxy_set_header X-authentik-uid      "";
proxy_set_header X-authentik-mfa      "";
