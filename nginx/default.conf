# Verbindungs-Upgrade (WebSockets) nur, wenn der Client es anfragt
map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

# ---------------------------------------------------------------------------
# Wer darf ohne Login (ohne Authentik-Benutzer) hinein?
#   - öffentliche Freigabe-Links /s/<token>/...
#   - Gäste mit Freigabe-Sitzung (Cookie tools_share) - nicht aber in die Plattform (/_platform/...)
#   - das Design der Fehlerseite (/_platform/assets/)
# Ob Link bzw. Sitzung wirklich gültig sind, prüft das Backend bei jeder Anfrage.
# $uri ist normalisiert (kein ".." möglich). Reihenfolge der Regeln ist wichtig (erste passende gewinnt).
# ---------------------------------------------------------------------------
map $http_x_authentik_username $has_user {
	""      0;
	default 1;
}
map $cookie_tools_share $has_share {
	""      0;
	default 1;
}
map "$has_user:$has_share:$uri" $deny_anon {
	default                    1;
	"~^1:"                     0;
	"~^0:.:/s/"                0;
	"~^0:.:/_platform/assets/" 0;
	"~^0:1:/_platform/"        1;
	"~^0:1:"                   0;
}

# Ratenbegrenzung pro Client-IP (der NPM setzt X-Real-IP). Gäste strenger als angemeldete Nutzer.
map $has_user $limit_anon_key {
	0       $http_x_real_ip;
	default "";
}
limit_req_zone $limit_anon_key zone=anon:10m rate=50r/s;
limit_req_zone $http_x_real_ip zone=api:10m rate=20r/s;
limit_req_status 429;

# ---------------------------------------------------------------------------
# Interner Server: liefert die statischen Tool-Dateien aus (sites/<slug>/).
# Lauscht nur auf 127.0.0.1 im Container, ist von außen nicht erreichbar.
# Wird ausschließlich vom Haupt-Server unten angesprochen, nachdem das Backend den Zugriff erlaubt hat.
# ---------------------------------------------------------------------------
server {
	listen 127.0.0.1:8081;
	server_tokens off;
	absolute_redirect off;
	root /srv/sites;

	add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "no-referrer" always;
	add_header Cache-Control "private, no-store" always;
	# Statische Tools dürfen eigene Inline-Skripte/Styles nutzen, bleiben aber auf die eigene Herkunft beschränkt
	add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' data: blob:; frame-ancestors 'none'; base-uri 'self'" always;

	location ~ /\. { return 404; }
	# Wird vom Backend angestoßen: /name -> /name/ (to ist vom Backend validiert: nur /[A-Za-z0-9_-]+/)
	location = /_redirect { return 302 $arg_to; }
	# Tool im Wartungsmodus
	# Portal-Startseite (wird vom Backend für "/" gewählt) - mit den strengen Portal-Headern
	location = /_portal {
		default_type text/html;
		alias /srv/portal/index.html;
		add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "DENY" always;
		add_header Cache-Control "private, no-store" always;
		add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
	}
	location = /_maintenance {
		default_type text/html;
		return 503 '<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wartung</title><body style="font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:90vh;margin:0;color:#14181f;background:#f6f7f9"><div style="text-align:center;max-width:420px;padding:24px"><h1 style="font-size:1.3rem">Wird gerade gewartet</h1><p style="color:#5d6676">Dieses Tool ist vorübergehend nicht verfügbar. Bitte versuche es später noch einmal.</p></div></body></html>';
	}
	# Tool verlangt Zwei-Faktor-Anmeldung
	location = /_mfa {
		default_type text/html;
		return 403 '<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Zwei-Faktor-Anmeldung erforderlich</title><body style="font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:90vh;margin:0;color:#14181f;background:#f6f7f9"><div style="text-align:center;max-width:440px;padding:24px"><h1 style="font-size:1.3rem">Zwei-Faktor-Anmeldung erforderlich</h1><p style="color:#5d6676">Dieses Tool ist nur mit Zwei-Faktor-Anmeldung nutzbar. Richte in deinem Konto einen zweiten Faktor ein (z.&nbsp;B. eine Authenticator-App), melde dich ab und wieder an.</p></div></body></html>';
	}
	# Freigabe-Link außerhalb des Zeitfensters oder von einer nicht erlaubten IP
	location = /_share_blocked {
		default_type text/html;
		return 403 '<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Gerade nicht freigegeben</title><body style="font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:90vh;margin:0;color:#14181f;background:#f6f7f9"><div style="text-align:center;max-width:440px;padding:24px"><h1 style="font-size:1.3rem">Gerade nicht freigegeben</h1><p style="color:#5d6676">Dieser Link ist zu dieser Zeit oder von deinem Netzwerk aus nicht freigegeben.</p></div></body></html>';
	}
	location / { try_files $uri $uri/ =404; }
}

# ---------------------------------------------------------------------------
# Haupt-Server: tools.example.de (wird vom Nginx Proxy Manager angesprochen)
# ---------------------------------------------------------------------------
server {
	listen 8080 default_server;
	server_tokens off;
	absolute_redirect off;
	resolver 127.0.0.11 valid=10s ipv6=off;   # Docker-DNS, um Container-Namen als Ziel aufzulösen

	# Ohne Authentik-Benutzer-Header (= nicht über NPM/Login gekommen) wird nichts ausgeliefert -
	# außer Freigabe-Links/-Sitzungen (siehe map oben).
	if ($deny_anon) { return 401; }
	limit_req zone=anon burst=300 nodelay;

	add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "no-referrer" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
	add_header Cross-Origin-Opener-Policy "same-origin" always;
	add_header Cross-Origin-Resource-Policy "same-origin" always;
	add_header Cache-Control "private, no-store" always;
	add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

	location ~ /\. { return 404; }

	# --- Interne Rechteprüfung (auth_request). Das Backend prüft auch das gemeinsame Geheimnis.
	location = /_authz {
		internal;
		proxy_pass http://tools-api:8000/authz;
		proxy_pass_request_body off;
		proxy_set_header Content-Length "";
		proxy_set_header Host $http_host;
		proxy_set_header X-Original-URI $request_uri;
		proxy_set_header X-Tools-Mode path;
	}
	location = /_authz_admin {
		internal;
		proxy_pass http://tools-api:8000/authz-admin;
		proxy_pass_request_body off;
		proxy_set_header Content-Length "";
	}

	# --- Alles von der Plattform selbst liegt unter /_platform/ (damit Tools Pfade wie /api oder /assets frei nutzen können)
	# Datei-Upload für Dateien-Tools (große Dateien und ZIPs)
	location /_platform/api/admin/files/ {
		limit_req zone=api burst=80 nodelay;
		client_max_body_size 100m;
		proxy_read_timeout 300s;
		proxy_pass http://tools-api:8000/api/admin/files/;
		proxy_set_header Host $http_host;
	}
	location /_platform/api/ {
		limit_req zone=api burst=80 nodelay;
		client_max_body_size 2m;
		proxy_pass http://tools-api:8000/api/;
		proxy_set_header Host $http_host;
	}
	location /_platform/assets/ {
		root /srv/portal;
	}
	# Portal unter fester Adresse. Solange eine App benutzt wird, gehört "/" der App -
	# wer hierher kommt, verlässt die App (danach zeigt auch "/" wieder das Portal).
	location = /_platform/portal {
		default_type text/html;
		alias /srv/portal/index.html;
		add_header Set-Cookie "tools_app=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Lax" always;
		add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "DENY" always;
		add_header Referrer-Policy "no-referrer" always;
		add_header Cross-Origin-Opener-Policy "same-origin" always;
		add_header Cache-Control "private, no-store" always;
		add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
	}
	location /_platform/admin/ {
		auth_request /_authz_admin;
		root /srv/portal;
		try_files $uri $uri/index.html =404;
	}

	# --- Startseite "/": Das Backend entscheidet:
	#     - direkt aufgerufen (Lesezeichen, Eingabe, aus der Verwaltung) -> Portal
	#     - Klick auf "Home" (Link auf "/") innerhalb einer App -> zurück in diese App (/<slug>/)
	#     - Gäste mit Freigabe-Sitzung -> die freigegebene App
	location = / {
		include /etc/nginx/snippets/tool-proxy.conf;
	}

	# --- Alle Tools: /<slug>/... -> Backend prüft die Gruppe und liefert das Ziel
	#     (interner Datei-Server oder die konfigurierte Weiterleitungs-Adresse)
	location / {
		include /etc/nginx/snippets/tool-proxy.conf;
	}
	location @tool {
		include /etc/nginx/snippets/tool-proxy.conf;
	}
	location @tool_down {
		default_type text/plain;
		return 502 "Das Tool ist gerade nicht erreichbar.\n";
	}
}

# ---------------------------------------------------------------------------
# Subdomain-Eingang: <slug>.tools.example.de (NPM-Wildcard-Host zeigt auf Port 8082).
# Hier gehört der komplette Host dem Tool - kein Portal, kein Pfad-Präfix.
# Das ist nötig für Apps, die nur auf der Wurzel "/" laufen (z. B. Single-Page-Apps wie
# der Nginx Proxy Manager selbst).
# ---------------------------------------------------------------------------
server {
	listen 8082 default_server;
	server_tokens off;
	absolute_redirect off;
	resolver 127.0.0.11 valid=10s ipv6=off;

	# Hier gibt es keine öffentlichen Links: ohne Login nichts.
	if ($http_x_authentik_username = "") { return 401; }

	location = /_authz {
		internal;
		proxy_pass http://tools-api:8000/authz;
		proxy_pass_request_body off;
		proxy_set_header Content-Length "";
		proxy_set_header Host $http_host;
		proxy_set_header X-Original-URI $request_uri;
		proxy_set_header X-Tools-Mode subdomain;
	}

	# Nur für die Fehlerseite "Kein Zugriff"
	location = /_platform/assets/forbidden.html { root /srv/portal; }
	location = /_platform/assets/style.css { root /srv/portal; }
	location = /_platform/assets/favicon.svg { root /srv/portal; }
	location = /_platform/assets/back.js { root /srv/portal; }

	location / {
		include /etc/nginx/snippets/tool-proxy.conf;
	}
	location @tool_down {
		default_type text/plain;
		return 502 "Das Tool ist gerade nicht erreichbar.\n";
	}
}
