server {
	listen 8080 default_server;
	server_tokens off;
	absolute_redirect off;
	root /srv/sites;

	# Ohne Authentik-Benutzer-Header (= nicht über NPM/Login gekommen) wird nichts ausgeliefert.
	if ($http_x_authentik_username = "") { return 401; }

	# Gemeinsame Header (Portal/Admin: strenge CSP)
	add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "no-referrer" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
	add_header Cache-Control "private, no-store" always;
	add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

	location ~ /\. { return 404; }

	# --- Interne Rechteprüfung (wird von auth_request genutzt)
	location = /_authz {
		internal;
		proxy_pass http://tools-api:8000/authz;
		proxy_pass_request_body off;
		proxy_set_header Content-Length "";
		proxy_set_header X-Original-URI $request_uri;
	}
	location = /_authz_admin {
		internal;
		proxy_pass http://tools-api:8000/authz-admin;
		proxy_pass_request_body off;
		proxy_set_header Content-Length "";
	}

	# --- API für Portal/Admin
	location /api/ {
		client_max_body_size 16k;
		proxy_pass http://tools-api:8000;
		proxy_set_header Host $http_host;
	}

	# --- Portal-Startseite und statische Dateien
	location = / {
		root /srv/portal;
		try_files /index.html =404;
	}
	location /assets/ {
		root /srv/portal;
	}
	location /admin/ {
		auth_request /_authz_admin;
		root /srv/portal;
		try_files $uri $uri/index.html =404;
	}

	# --- Alle Tools: /<slug>/... -> Rechteprüfung per Gruppe
	location / {
		auth_request /_authz;
		# Tools dürfen eigene Inline-Skripte/Styles nutzen, bleiben aber auf eigene Herkunft beschränkt
		add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' data: blob:; frame-ancestors 'none'; base-uri 'self'" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "DENY" always;
		add_header Referrer-Policy "no-referrer" always;
		add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
		add_header Cache-Control "private, no-store" always;
		try_files $uri $uri/ =404;
	}
}
