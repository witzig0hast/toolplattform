# Statischer Webserver für die Tools. Wird NICHT nach außen veröffentlicht (kein "ports:"),
# nur der Nginx Proxy Manager erreicht ihn über das gemeinsame Docker-Netzwerk.
services:
  tools-web:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: tools-web
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/tools.d:/etc/nginx/tools.d:ro
      - ./sites:/srv/sites:ro
    networks: [npm]

networks:
  npm:
    name: ${NPM_NETWORK:-nginx-proxy-manager_default}
    external: true
