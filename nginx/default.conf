server {
	listen 8080 default_server;
	server_tokens off;
	root /srv/sites;

	add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "no-referrer" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
	add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
	add_header Cache-Control "private, no-store" always;

	# Ohne Authentik-Benutzer-Header (= nicht über NPM/Login gekommen) wird nichts ausgeliefert.
	if ($http_x_authentik_username = "") { return 401; }

	# Versteckte Dateien nie ausliefern
	location ~ /\. { return 404; }

	# Ein Block pro Tool, erzeugt von ./new-tool.sh
	include /etc/nginx/tools.d/*.conf;

	location = / {
		root /srv/sites/_portal;
		try_files /index.html =404;
	}
	location / { return 404; }
}
