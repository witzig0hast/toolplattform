# NPM -> Proxy Host -> Tab "Custom locations" -> "Add location"
#   Define location: /     Scheme: http     Forward Hostname: tools-web     Port: 8080
# Dann auf das Zahnrad (⚙) klicken und DIESEN Text einfügen.
# ERSETZEN: DEIN_TOOLS_SECRET durch den Wert von TOOLS_SECRET aus deiner .env

auth_request     /outpost.goauthentik.io/auth/nginx;
error_page       401 = @goauthentik_proxy_signin;
auth_request_set $auth_cookie $upstream_http_set_cookie;
add_header       Set-Cookie $auth_cookie;

# Identität von Authentik an tools-web weiterreichen (überschreibt alles, was ein Client schickt)
auth_request_set $authentik_username $upstream_http_x_authentik_username;
auth_request_set $authentik_groups   $upstream_http_x_authentik_groups;
proxy_set_header X-authentik-username $authentik_username;
proxy_set_header X-authentik-groups   $authentik_groups;

# Gemeinsames Geheimnis: nur Anfragen, die den NPM durchlaufen haben, werden von tools-web akzeptiert
proxy_set_header X-Tools-Secret "DEIN_TOOLS_SECRET";
