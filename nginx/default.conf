# Verbindungs-Upgrade (WebSockets) nur, wenn der Client es anfragt
map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

# ---------------------------------------------------------------------------
# Interner Server: liefert die statischen Tool-Dateien aus (sites/<slug>/).
# Lauscht nur auf 127.0.0.1 im Container, ist von außen nicht erreichbar.
# Wird ausschließlich vom Haupt-Server unten angesprochen, nachdem das Backend den Zugriff erlaubt hat.
# ---------------------------------------------------------------------------
server {
	listen 127.0.0.1:8081;
	server_tokens off;
	absolute_redirect off;
	root /srv/sites;

	add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "no-referrer" always;
	add_header Cache-Control "private, no-store" always;
	# Statische Tools dürfen eigene Inline-Skripte/Styles nutzen, bleiben aber auf die eigene Herkunft beschränkt
	add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' data: blob:; frame-ancestors 'none'; base-uri 'self'" always;

	location ~ /\. { return 404; }
	# Wird vom Backend angestoßen: /name -> /name/ (to ist vom Backend validiert: nur /[a-z0-9-]+/)
	location = /_redirect { return 301 $arg_to; }
	location / { try_files $uri $uri/ =404; }
}

# ---------------------------------------------------------------------------
# Haupt-Server (wird vom Nginx Proxy Manager angesprochen)
# ---------------------------------------------------------------------------
server {
	listen 8080 default_server;
	server_tokens off;
	absolute_redirect off;
	resolver 127.0.0.11 valid=10s ipv6=off;   # Docker-DNS, um Container-Namen als Ziel aufzulösen

	# Ohne Authentik-Benutzer-Header (= nicht über NPM/Login gekommen) wird nichts ausgeliefert.
	if ($http_x_authentik_username = "") { return 401; }

	add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "no-referrer" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
	add_header Cache-Control "private, no-store" always;
	add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

	location ~ /\. { return 404; }

	# --- Interne Rechteprüfung (auth_request). Das Backend prüft auch das gemeinsame Geheimnis.
	location = /_authz {
		internal;
		proxy_pass http://tools-api:8000/authz;
		proxy_pass_request_body off;
		proxy_set_header Content-Length "";
		proxy_set_header Host $http_host;
		proxy_set_header X-Original-URI $request_uri;
	}
	location = /_authz_admin {
		internal;
		proxy_pass http://tools-api:8000/authz-admin;
		proxy_pass_request_body off;
		proxy_set_header Content-Length "";
	}

	# --- Alles von der Plattform selbst liegt unter /_platform/ (damit Tools Pfade wie /api oder /assets frei nutzen können)
	location /_platform/api/ {
		client_max_body_size 16k;
		proxy_pass http://tools-api:8000/api/;
		proxy_set_header Host $http_host;
	}
	location /_platform/assets/ {
		root /srv/portal;
	}
	location /_platform/admin/ {
		auth_request /_authz_admin;
		root /srv/portal;
		try_files $uri $uri/index.html =404;
	}

	# --- Portal-Startseite
	location = / {
		root /srv/portal;
		try_files /index.html =404;
	}

	# --- Alle Tools: /<slug>/... -> Backend prüft die Gruppe und liefert das Ziel
	#     (interner Datei-Server oder die konfigurierte Weiterleitungs-Adresse)
	location / {
		auth_request /_authz;
		auth_request_set $tool_target $upstream_http_x_tool_target;
		auth_request_set $tool_prefix $upstream_http_x_tool_prefix;
		auth_request_set $tool_cookie $upstream_http_x_tool_cookie;

		client_max_body_size 100m;
		proxy_read_timeout 300s;
		proxy_http_version 1.1;
		proxy_pass $tool_target;

		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $http_x_real_ip;
		proxy_set_header X-Forwarded-For $http_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
		proxy_set_header X-Forwarded-Host $http_host;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		# Das Plattform-Geheimnis geht niemals an die Tools weiter
		proxy_set_header X-Tools-Secret "";

		# Sicherheits-Header kommen vom jeweiligen Tool bzw. vom internen Datei-Server
		add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
		# Merkt sich das zuletzt genutzte Tool (für Apps mit absoluten Pfaden wie /api/...)
		add_header Set-Cookie $tool_cookie always;
		# Absolute Weiterleitungen der Tools (Location: /login) bekommen das Tool-Präfix
		proxy_redirect ~^/(.*)$ $tool_prefix/$1;
		error_page 502 504 @tool_down;
	}
	location @tool_down {
		default_type text/plain;
		return 502 "Das Tool ist gerade nicht erreichbar.\n";
	}
}
