# Gemeinsamer Teil für den Zugriff auf ein Tool (Pfad- und Subdomain-Eingang).
# Das Backend (auth_request /_authz) prüft die Rechte und liefert das Ziel.
auth_request /_authz;
auth_request_set $tool_target $upstream_http_x_tool_target;
auth_request_set $tool_redir_from $upstream_http_x_tool_redir_from;
auth_request_set $tool_redir_to $upstream_http_x_tool_redir_to;
auth_request_set $tool_cookie $upstream_http_x_tool_cookie;

client_max_body_size 100m;
proxy_read_timeout 300s;
proxy_http_version 1.1;
proxy_pass $tool_target;

proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $http_x_real_ip;
proxy_set_header X-Forwarded-For $http_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
# Das Plattform-Geheimnis geht niemals an die Tools weiter
proxy_set_header X-Tools-Secret "";

# Sicherheits-Header kommen vom jeweiligen Tool bzw. vom internen Datei-Server
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
# Merkt sich das zuletzt genutzte Tool (für Apps mit absoluten Pfaden wie /api/...)
add_header Set-Cookie $tool_cookie always;
# Weiterleitungen der Tools (Location: /login) bekommen das Tool-Präfix (bzw. den Freigabe-Pfad)
proxy_redirect $tool_redir_from $tool_redir_to;
# Freigabe-Links (/s/<token>/) sollen nicht indexiert werden und den Token nicht an Dritte verraten
add_header X-Robots-Tag "noindex, nofollow" always;
proxy_hide_header Referrer-Policy;
add_header Referrer-Policy "same-origin" always;
error_page 403 =403 /_platform/assets/forbidden.html;
error_page 502 504 @tool_down;
