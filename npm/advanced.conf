# NPM -> Proxy Host -> Tab "Advanced" -> hier einfügen.
# ERSETZEN:
#   AUTHENTIK_IP:9000   durch die Adresse deines Authentik-Servers (Port 9000 = Embedded Outpost),
#                       z.B. http://192.168.1.20:9000  oder  http://authentik-server:9000 (gleiches Docker-Netz)
#   DEIN_TOOLS_SECRET   durch den Wert von TOOLS_SECRET aus deiner .env

proxy_buffers 8 16k;
proxy_buffer_size 32k;
port_in_redirect off;
# Erlaubt die Kette "nicht angemeldet -> Freigabe-Sitzung prüfen -> sonst Login" (zwei error_page-Schritte)
recursive_error_pages on;

location /outpost.goauthentik.io {
	proxy_pass          http://AUTHENTIK_IP:9000/outpost.goauthentik.io;
	proxy_set_header    Host $host;
	proxy_set_header    X-Original-URL $scheme://$http_host$request_uri;
	add_header          Set-Cookie $auth_cookie;
	auth_request_set    $auth_cookie $upstream_http_set_cookie;
	proxy_pass_request_body off;
	proxy_set_header    Content-Length "";
}

location @goauthentik_proxy_signin {
	internal;
	add_header Set-Cookie $auth_cookie;
	return 302 /outpost.goauthentik.io/start?rd=$scheme://$http_host$request_uri;
}

# Nicht angemeldet? Bevor zum Login geschickt wird, fragt der NPM die Plattform, ob der Besucher
# eine gültige Freigabe-Sitzung hat (Gast, der über einen Freigabe-Link kam). Nur wenn nicht -> Login.
location @tools_maybe_share {
	internal;
	proxy_pass http://tools-web:8080;
	proxy_http_version 1.1;
	proxy_set_header Host               $host;
	proxy_set_header X-Real-IP          $remote_addr;
	proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto  $scheme;
	proxy_set_header Upgrade            $http_upgrade;
	proxy_set_header Connection         $http_connection;
	proxy_set_header X-Tools-Secret     "DEIN_TOOLS_SECRET";
	# Gäste haben keine Identität - vom Client mitgeschickte Login-Header entfernen
	proxy_set_header X-authentik-username "";
	proxy_set_header X-authentik-groups   "";
	proxy_set_header X-authentik-email    "";
	proxy_set_header X-authentik-name     "";
	proxy_set_header X-authentik-uid      "";
	# Antwortet die Plattform mit 401 (keine gültige Freigabe), geht es zum Authentik-Login
	proxy_intercept_errors on;
	error_page 401 = @goauthentik_proxy_signin;
}
